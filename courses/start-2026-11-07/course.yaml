# DroneHacks 2026 course, layout v3: the ONLY file holding course-specific numbers and piece names.
# Code reads everything course-specific from here (rule 9.5: no hard-coded routes or waypoints).
#
# Frame `map`: the published course file's own frame. Metres, z up; for this OBJ x = east,
# y = north, origin = centre of the floor. Every coordinate below is in `map`.
#
# Checkpoint lines are checked against the event page's "Checkpoints from above" diagram
# (20 x 20 ft; map metres = feet * 0.3048 - 3.048 on both axes, north up). `confirmed: false`
# marks values still derived only from the OBJ's geometry.

# 2026-11-07 evening: the organizers REBUILT THE START (no exact dimensions, by design). Maze dividers
# M1, M2, M3 are gone; a back wall (Wall A) and a diagonal (Wall B) are new, with a cone in the CP2 gap.
# They come from Darion's corrected drawing (~19:35; approximate), added as a small
# extra mesh. CP1 is removed; CP2 is the gap between Wall A and Wall B. The rest is unchanged.
# NOT FOR FLIGHT AT RUNTIME (Arnav's directive): this map is for sims, offline checks and waypoints.
course:
  name: dronehacks-2026-v3-start2
  mesh:                                         # relative to this file; provenance in course/SOURCE.md
    - course/dronehacks-course-v3.obj           # the published course
    - course/start-2026-11-07.obj               # the rebuilt start, from Darion's drawing

launch:
  x: -2.515                                     # centre of the "Launch mark" piece
  y: 0.914
  yaw_deg: 90.0                                 # facing +y (north), up the first corridor. The sim's spawn yaw;
                                                # confirm how the drone is placed on the mark at the net.
  base_link_z: 0.07                             # base_link height when sitting on the mark: sim value,
                                                # measure on the real drone
  confirmed: false                              # the sim spawns 0.2 m north of this mark: see launch_sim

launch_sim:                                     # where the SIMULATOR spawns the drone (use for sim runs)
  x: -2.5146                                    # FlyX environment.json spawn point; the T4 replica uses the
  y: 1.1144                                     # same, confirmed by its ground truth on 2026-11-07. Route v5
  yaw_deg: 90.0                                 # (Darion) is generated from this point.
  base_link_z: 0.07
  confirmed: true

limits:
  wall_top_z: 1.727                             # 68 in. Some part of the frame must stay below it (rule 7.7)
  height_band: [0.6, 1.4]                       # nominal flight heights for the planner
  drone_radius: 0.28                            # rotor arm plus prop
  clearance_margin: 0.10                        # on top of drone_radius: the planner's minimum clearance is 0.38 m

# Checkpoints in course order. A `line` is a floor segment [[x, y], [x, y]] the WHOLE drone must cross
# (its centre at least drone_radius past the line), moving along `direction`.
checkpoints:
  # CP1 was REMOVED with the rebuilt start (2026-11-07; the organizers haven't said otherwise).
  - id: CP2
    name: the gap between Wall A's east end and Wall B's north-east end (rebuilt start)
    line: [[-1.277, 2.640], [-1.023, 1.932]]    # wall end to wall end, ~0.75 m (Darion's corrected drawing)
    direction: [0.941, 0.338]                   # the gap's normal, about 20 deg north of east
    confirmed: false
    # The 0.30 m cone ("Boulder 6") stands inside the gap; flying at 0.7 m passes 0.4 m over it.
  - id: CP3
    name: tunnel south exit
    line: [[1.581, -0.305], [3.042, -0.305]]    # the tube's open south end, inner width
    direction: [0.0, -1.0]
    points: 10
    confirmed: true
  - id: CP4
    name: enter the landing area through Gate B or the window, without landing
    points: 7
    options:
      - name: Gate B
        line: [[0.157, -0.548], [0.157, 0.406]]     # from wall C2b's north end straight north to the barrier
        direction: [-1.0, 0.0]                      # westward, into the landing area
        confirmed: true
      - name: window
        line: [[-0.628, -2.702], [-0.315, -1.843]]  # window in wall C2a, along the wall's centre line
        direction: [-0.940, 0.343]
        z: [0.305, 1.219]                           # the opening's bottom and top edges
        bonus_points: 5
        confirmed: true
  - id: CP5
    name: land and disarm with the whole drone inside the pad's outer ring
    centre: [-2.042, -0.792]                    # "Landing pad" rings r9 / r20 / r30 share this centre
    outer_radius: 0.762                         # ring r30: 30 in
    points: 7

zones:
  landing_area:                                 # the "Approach ring (stage 4 line)" piece: a circle on the floor
    centre: [-2.042, -0.792]
    radius: 0.99

build:
  output: course_sdf.npz                        # relative to this file
  cell: 0.05                                    # output voxel size (m)
  oversample: 3                                 # fine voxels per output cell while building (odd)
  bounds:                                       # first and last output voxel CENTRES: the net (+-3.048 m,
    min: [-3.25, -3.25, -0.10]                  # 3.048 m tall) plus about 0.2 m
    max: [3.25, 3.25, 3.25]
  fields:
    planning:                                   # everything solid, including the floor and the net
      include: ["*"]
      exclude: ["Landing pad*", "Launch mark", "Guideline*", "Approach ring*",   # floor markings, <= 3 mm
                "M1 maze divider", "M2 maze divider", "M3 maze divider"]        # removed 2026-11-07
    localization:                               # solid vertical surfaces a depth camera sees reliably.
      include: ["*wall*", "Barrier*", "*divider*", "Tube*", "Boulder*"]          # No floor, no net
      exclude: ["M1 maze divider", "M2 maze divider", "M3 maze divider"]       # (cameras see through it)
  plot_heights: [0.3, 0.76, 1.0, 1.5]           # 0.76 m is the window's centre height

# Places where flights run closest to the map's surfaces (from the team's FlyX and T4 runs and the
# perturbed-course suite). tools/audit_sdf.py reports the map's error against exact geometry here.
audit_spots:
  - {name: "Wall A east end",         at: [-1.277, 2.640], radius: 0.5}
  - {name: "Wall B north-east end",   at: [-1.023, 1.932], radius: 0.5}
  - {name: "CP2 gap",                 at: [-1.150, 2.286], radius: 0.4}
  - {name: "Gate B approach",         at: [0.53, -0.95],   radius: 0.4}
  - {name: "wall end near point 8",   at: [0.57, 2.77],    radius: 0.4}

# Checked through the runtime loader after every build; a failure keeps the previous map file.
# Expected values come from the OBJ's piece dimensions. Ridge points (midway between two
# surfaces) read up to ~2.5 cm low because the field is trilinear between 5 cm voxels.
sanity:
  - {name: "launch at flight height",       at: [-2.515, 0.914, 1.0],    min: 0.38, max: 0.43}  # barrier 0.41 behind
  - {name: "launch near the floor",         at: [-2.515, 0.914, 0.15],   min: 0.13, max: 0.17}
  - {name: "launch near the floor (loc)",   at: [-2.515, 0.914, 0.15],   field: localization, min: 0.38, max: 0.43}
  - {name: "first corridor centre",         at: [-2.515, 1.6, 1.0],      min: 0.50, max: 0.55}  # 1.07 m wide
  - {name: "next to the net",               at: [-2.95, 1.6, 1.0],       min: 0.08, max: 0.12}
  - {name: "next to the net (loc)",         at: [-2.95, 1.6, 1.0],       field: localization, min: 0.93}   # no wall near: M1 removed
  - {name: "CP2 gap centre",                at: [-1.150, 2.286, 1.0],    min: 0.34, max: 0.40}  # ~0.75 m gap
  - {name: "CP2 gap at flight height",      at: [-1.150, 2.286, 0.77],   min: 0.30}             # over the cone
  - {name: "old Gate A strip, now open",    at: [0.305, 2.0, 1.0],       min: 0.6}              # M3 removed
  - {name: "tunnel centre",                 at: [2.3115, 0.457, 0.94],   min: 0.68, max: 0.75}  # 1.46 m inner width
  - {name: "Gate B opening",                at: [0.157, -0.07, 1.0],     min: 0.42}   # 0.95 m wide
  - {name: "gap between A1 and C2b",        at: [-0.408, -0.576, 1.0],   min: 0.45}
  - {name: "window centre",                 at: [-0.471, -2.272, 0.762], min: 0.42, max: 0.47}  # 0.914 m square
  - {name: "M1 gone",                       at: [-1.9305, 1.3, 1.0],     min: 0.3}
  - {name: "inside start wall A",           at: [-2.0, 2.690, 1.0],      max: 0.0}
  - {name: "inside start wall B",           at: [-1.342, 1.320, 1.0],    max: 0.0}
  - {name: "inside the CP2 cone",           at: [-1.369, 2.335, 0.15],   max: 0.0}
  - {name: "inside barrier 2",              at: [-0.6, 0.457, 1.0],      max: 0.0}
  - {name: "inside boulder 1",              at: [2.0115, -2.4685, 0.27], max: -0.1}
  - {name: "inside wall C2a, below window", at: [-0.471, -2.272, 0.15],  max: 0.01}  # diagonal 10 cm wall

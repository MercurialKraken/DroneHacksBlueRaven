# Darion's full course (wall-seek method): straight legs, full stops, slow in-place turns, depth fixes on known walls.
# Course: start-2026-11-08 with Wall C (no cone), CP4 through the WINDOW. Planned and clearance-checked by darion-claude
# on 2026-11-08 against the course SDF + Wall C (drone radius 0.29 + 0.10 margin): every leg >= 0.39 m from walls
# (tightest: the window frame's sides, 0.457 - 0.29 = 0.167 m each side; the chicane wall's tip 0.41 m).
#
# Frame 'map' (course.yaml): metres, x east, y north, origin the floor's centre. The mission flies in its pad frame
# (north = the nose on the launch mark, east = its right, origin = the launch point) and converts these points with
# `launch`. Every depth fix shifts the remaining points by the measured drift (capped by fix_max_m).
#
# Before the steps, the mission's own start runs unchanged: take off to height_m, forward until Wall A is standoff_m
# ahead (depth), full stop = P1.

launch: {x: -2.515, y: 1.466, yaw_deg: 90.0}   # Pixhawk 110 cm south of the top red tape line's top edge, nose north

# Wall faces the depth camera reads: a point ON the face and the face's unit normal pointing to the drone's side.
walls:
  wall_a:  {point: [-2.515, 2.591],    normal: [0.0, -1.0]}          # south face, 1.125 m ahead of the launch (Darion)
  wall_c:  {point: [0.1319, 0.5233],   normal: [-0.4540, 0.8910]}    # NW face: centre line (0.155,0.478)-(1.592,1.210), 4 in thick
  barrier: {point: [0.0, 0.410],       normal: [0.0, -1.0]}          # south face (centre 0.457, ~9 cm thick)
  c2a:     {point: [-0.4245, -2.2896], normal: [0.9396, -0.3424]}    # east face of the window's wall (10 cm thick)

steps:
  - {fix: wall_a}                         # P1 (stopped by depth): fix north
  - {face: [-0.662, 2.265]}
  - {leg: [-0.662, 2.265], name: P2}      # through the CP2 gap
  # v4 (Darion): every leg NOSE-FIRST (face, then straight ahead: never sideways); no Wall C fix (its turns to face the
  # wall and back are the in-place turns that broke cuVSLAM); climb to the tube's height at P2, so the whole approach to
  # the tunnel is flown at it. Stops after a leg hold that leg's exact end point (v3 stopped 11 cm short at the window).
  - {height: 0.85}                        # the tube's free space is centred ~0.94 m up: only 0.36 m clearance at 0.40
  - {face: [2.3115, 1.850]}
  - {leg: [2.3115, 1.850], name: P4}      # north of the tunnel's mouth (Wall C off the right of the nose)
  - {face: [2.400, -1.100]}
  - {leg: [2.400, -1.100], name: P5}      # through the tunnel: CP3 (whole drone past y -0.305)
  - {face: [0.427, -2.600]}
  - {leg: [0.427, -2.600], name: P6}      # 0.96 m in front of the window on its axis; 0.32 m over the boulder
  - {height: 0.72}                        # window: sill 0.305, top 1.219; 0.20 m over the chicane boulder beside P6
  - {face_yaw: 160.0}                     # square to the window
  - {clear: 1.30}                         # go / no-go: depth must see THROUGH the window (nothing within 1.30 m)
  - {leg: [-0.988, -2.084], name: W2}     # through the window: CP4 (+5), whole drone 0.26 m past its line
  - {face: [-2.042, -0.792]}
  - {leg: [-2.042, -0.792], name: PAD}    # the pad's centre: land (CP5)

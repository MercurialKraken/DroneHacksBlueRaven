# onboard/depth/stereo_depth_node.py (Task C). Defaults are for the real drone (skybeta v0.3.2):
# the organizers' OAK driver publishes raw 1024x640 bgr8 pairs at 30 Hz and no depth.
/**:
  ros__parameters:
    # MONO, never image_raw or */compressed. arnav-claude, skybeta-09, PX4 live, 2026-11-07: subscribing to the
    # raw bgr8 pair (2 MB each at 30 Hz) forces the driver to convert and copy it out of its NITROS path, which
    # starves cuVSLAM. EV age at PX4 went 58 -> 173/313 ms (p50/p90), EV fusion 79% pos / 67% yaw, and the mag
    # heading took over. image_mono (mono8, same 1024x640, same frame_id and calibration): 58/69 ms, EV fusion 100%.
    left_topic: /oak/left/image_mono
    right_topic: /oak/right/image_mono
    left_info_topic: /oak/left/camera_info
    right_info_topic: /oak/right/camera_info
    depth_topic: /camera/depth/image_raw          # what refnav, map_align and live_map subscribe to
    depth_info_topic: /camera/depth/camera_info
    status_topic: /stereo_depth/status
    rate_hz: 5.0          # a few Hz is enough for the follower and the map fit; the Jetson is shared with VIO
    scale: 0.5            # 512x320 on the drone
    min_m: 0.35
    max_m: 6.0
    encoding: 16UC1
    sync_tol_s: 0.003
    out_frame: ""         # default: the left camera frame, or <left>_rect when rectification rotates it

# In the T4 sim, to compare against the sim's own depth without replacing it:
#   -p left_topic:=/stereo/left/image -p right_topic:=/stereo/right/image
#   -p left_info_topic:=/stereo/left/camera_info -p right_info_topic:=/stereo/right/camera_info
#   -p depth_topic:=/blueraven/depth/image_raw -p depth_info_topic:=/blueraven/depth/camera_info -p use_sim_time:=true

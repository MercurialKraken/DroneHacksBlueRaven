/**:
  ros__parameters:
    # Hardware defaults. Launch with use_sim_time in an ordinary ROS simulation.
    use_sim_time: false
    odom_topic: /visual_slam/tracking/odometry
    health_topic: /estimator/healthy
    world: flu
    # Unreferenced startup heading stays FRD. A surveyed reference must supply
    # BOTH heading_enu_rad and heading_reference; the bridge then rotates it.
    required_fields: [position, orientation]
    max_sample_age_s: 0.3
    health_quiet_s: 5.0
    # In AUTO_LAND/DESCEND with a fresh downward range at or below this, the last pose is held until disarm.
    land_freeze_m: 0.7     # cuVSLAM degrades from ~0.6 m over the pad: freeze a pose from before that, for the whole descent
    freeze_max_age_s: 0.3  # never latch a sample older than this (a freeze must not hold a pose from before an outage)

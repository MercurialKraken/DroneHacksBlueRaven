/**:
  ros__parameters:
    # Physical companion default. The simulator's deployment file selects its clock.
    use_sim_time: false
    # assisted: depth gates arming, stops at obstacles and map_align corrects the pose. blind: waypoints and map only,
    # no depth subscription. The drone's depth image is /oak/stereo/image_raw.
    depth_mode: assisted
    depth_topic: /camera/depth/image_raw
    depth_info_topic: /camera/depth/camera_info
    health_topic: /estimator/healthy
    base_frame: base_link
    control_topic: /refnav/control
    status_topic: /refnav/status
    yaw_rate_dps: 45.0   # faster turns broke cuVSLAM tracking near walls
    # route_name (main.py ROUTE): full is route.json planned live from the course map; cp1 and maze are
    # routes/route_<name>_<launch_key>.json flown as given. launch_key: launch_sim (default) or launch (the real mark).

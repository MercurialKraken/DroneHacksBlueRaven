/**:
  ros__parameters:
    # Physical companion default. The simulator's deployment file selects its clock.
    use_sim_time: false
    # assisted: depth gates arming and stops at obstacles; map_align corrects the pose only where main.py starts it
    # (never on the drone). blind: no depth subscription. refnav.launch.py sets the drone's own values.
    depth_mode: assisted
    depth_topic: /camera/depth/image_raw
    depth_info_topic: /camera/depth/camera_info
    health_topic: /estimator/healthy
    base_frame: base_link
    control_topic: /refnav/control
    status_topic: /refnav/status
    yaw_rate_dps: 45.0   # faster turns broke cuVSLAM tracking near walls
